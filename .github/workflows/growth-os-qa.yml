name: Growth OS demo QA

on:
  pull_request:
    paths:
      - "work/growth-os/**"
      - "tests/growth_os_browser.py"
      - ".github/workflows/growth-os-qa.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Chromium responsive and interaction checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Validate JavaScript
        run: node --check work/growth-os/app.js
      - name: Run interactive Chromium tests
        run: python tests/growth_os_browser.py
      - name: Publish QA screenshots and JSON samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: growth-os-chromium-qa
          path: docs/qa/milestone-c2/growth-os/
          if-no-files-found: ignore
          retention-days: 14
